name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: Build, testes e cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'
          cache: maven

      # Testcontainers usa o Docker disponível no runner.
      - name: ./mvnw verify
        run: ./mvnw -B verify

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: tools/coverage/target/site/jacoco-aggregate/
          if-no-files-found: error

  # O exemplo (examples/notas) com o código deste commit: as bibliotecas instaladas no repositório Maven local e a
  # imagem construída aqui, no lugar das versões publicadas que o exemplo fixa. Roda a demonstração de ponta a ponta.
  example:
    name: Exemplo de ponta a ponta
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'
          cache: maven

      - name: Bibliotecas e imagem deste commit
        run: |
          ./mvnw -B -q install -DskipTests
          echo "AUTH_VERSION=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_ENV"
          docker build -t "$IMAGE:ci" .

      - name: ./mvnw verify do exemplo
        working-directory: examples/notas
        run: ./mvnw -B verify -Dauth.version="$AUTH_VERSION"

      - name: Sobe a stack do exemplo
        working-directory: examples/notas
        run: AUTH_IMAGE_TAG=ci docker compose --profile app up -d --build

      - name: demo.sh
        working-directory: examples/notas
        run: ./demo.sh

      - name: Logs da stack
        if: failure()
        working-directory: examples/notas
        run: docker compose --profile app logs --no-color

  # Tag vX.Y.Z: publica as bibliotecas e o pom pai no GitHub Packages, com a versão da tag.
  libraries:
    name: Bibliotecas no GitHub Packages
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # O setup-java grava no settings.xml o servidor "github" com o GITHUB_TOKEN, o mesmo id do distributionManagement.
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Versão da tag
        run: ./mvnw -B -q versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: ./mvnw deploy
        run: ./mvnw -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Pull request: só confere que a imagem compila. Push na main: publica :main e :sha-<commit>. Tag v1.2.3: publica
  # :1.2.3, :1.2 e :latest, as versões que os projetos fixam no compose.
  image:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login no ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # amd64 para servidores e CI; arm64 para Macs com Apple Silicon.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
