# Perfil dos testes: PostgreSQL e Redis vêm do Testcontainers (@ServiceConnection).
management:
  server:
    port: 0

logging:
  structured:
    format:
      console: ""

spring:
  security:
    oauth2:
      authorizationserver:
        client:
          app-cli:
            registration:
              client-id: app-cli
              client-authentication-methods: none
              authorization-grant-types: urn:ietf:params:oauth:grant-type:device_code
              scopes: email
            require-authorization-consent: true
            token:
              access-token-time-to-live: 15m
          app-web:
            registration:
              client-id: app-web
              client-secret: "{noop}test-web-secret"
              redirect-uris: http://localhost:8070/login/oauth2/code/app
              post-logout-redirect-uris: http://localhost:8070/
              client-authentication-methods: client_secret_basic
              authorization-grant-types: authorization_code,refresh_token
              scopes: openid,email
            require-proof-key: true
            token:
              access-token-time-to-live: 15m
              refresh-token-time-to-live: 30d
              reuse-refresh-tokens: true
          app-dev:
            registration:
              client-id: app-dev
              client-authentication-methods: none
              authorization-grant-types: authorization_code
              redirect-uris: http://localhost:8080/swagger-ui/oauth2-redirect.html
              scopes: openid,email
            require-proof-key: true
            token:
              access-token-time-to-live: 15m

app:
  auth:
    display-name: Conta de teste
    audience: app-api
    signing-key:
      id: test-1
      location: classpath:keys/test-signing-key.pem
    previous-signing-key:
      id: test-0
      location: classpath:keys/test-previous-key.pem
    panel-origins: http://localhost:8070
    panel-default-url: http://localhost:8070/
  cors:
    allowed-origins: http://localhost:8080
  # Todos os testes saem do mesmo IP e do mesmo cliente: os testes de limite preenchem o contador até o limite.
  rate-limit:
    login: { requests: 1000000 }
    login-email: { requests: 1000000 }
    register: { requests: 1000000 }
    password-change: { requests: 1000000 }
    token: { requests: 1000000 }
    token-client: { requests: 1000000 }
    device-authorization: { requests: 1000000 }
    device-verification: { requests: 1000000 }
